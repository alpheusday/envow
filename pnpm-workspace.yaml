packages:
    - ./package
    - ./test
    - ./examples/*

autoInstallPeers: false
strictPeerDependencies: false

allowBuilds:
    esbuild: false
    sharp: true

catalogs:
    dep:
        "@standard-schema/spec": ^1.1.0
    dev:
        arktype: 2.2.0
        valibot: 1.4.0
        zod: 4.4.0
    peer:
        arktype: ^2.2.0
        valibot: ^1.4.0
        zod: ^4.4.0
    example:
        "@types/react": ^19.2.18
        "@types/react-dom": ^19.2.4
        react: ^19.2.8
        react-dom: ^19.2.8
        next: 16.3.2
        vite: ^8.2.1

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
    - "@apst/*"
    - "@srvkit/*"
    - "@typescript/*"
    - typescript
